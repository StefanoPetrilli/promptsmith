version: "3"

# Environment sanity tasks — invoked like `task env:setup`, `task env:check`.

tasks:
  setup:
    desc: Create .venv and install numeri editable + deps
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install --upgrade pip
      - .venv/bin/pip install -e .
      - task: fetch-assets
      - task: check
    sources:
      - pyproject.toml
    generates:
      - .venv/bin/python

  fetch-assets:
    desc: Download SAM 3 checkpoint (open mirror) + CLIP BPE vocab needed by the sam3 package
    cmds:
      - |-
        {{.PY}} - <<'PY'
        from pathlib import Path
        import shutil, os
        # 1) SAM 3 checkpoint from the open mirror 1038lab/sam3 (facebook/sam3 is gated)
        ckpt = Path("models/sam3/sam3.pt")
        if not ckpt.exists():
            from huggingface_hub import hf_hub_download
            ckpt.parent.mkdir(parents=True, exist_ok=True)
            p = hf_hub_download(repo_id="1038lab/sam3", filename="sam3.pt", local_dir="models/sam3")
            print("downloaded SAM 3 checkpoint:", p)
        else:
            print("SAM 3 checkpoint already present:", ckpt)
        # 2) CLIP BPE vocab expected by sam3.model.tokenizer_ve.SimpleTokenizer.
        #    The pip package looks for site-packages/assets/bpe_simple_vocab_16e6.txt.gz
        #    but does not ship it; fetch it from the openai/CLIP repo.
        import sam3, site
        sp = Path(site.getsitepackages()[0])
        assets = sp / "assets" / "bpe_simple_vocab_16e6.txt.gz"
        if not assets.exists():
            assets.parent.mkdir(parents=True, exist_ok=True)
            import urllib.request
            url = "https://raw.githubusercontent.com/openai/CLIP/main/clip/bpe_simple_vocab_16e6.txt.gz"
            urllib.request.urlretrieve(url, assets)
            print("downloaded BPE vocab:", assets)
        else:
            print("BPE vocab already present:", assets)
        PY

  check:
    desc: Print Python, torch, CUDA availability, and config target
    cmds:
      - .venv/bin/python -m numeri env-check