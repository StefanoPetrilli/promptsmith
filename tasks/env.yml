version: "3"

# Environment tasks — `task env:setup`, `task env:check`.

tasks:
  setup:
    desc: Create .venv, install deps, and fetch SAM 3 checkpoint + CLIP BPE vocab
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install --upgrade pip
      - .venv/bin/pip install -e .
      - task: fetch-assets
    sources:
      - pyproject.toml
    generates:
      - .venv/bin/python

  fetch-assets:
    desc: Download SAM 3 checkpoint (open mirror 1038lab/sam3) + CLIP BPE vocab needed by sam3
    cmds:
      - |-
        {{.PY}} - <<'PY'
        from pathlib import Path
        import site
        # 1) SAM 3 checkpoint (facebook/sam3 is gated; use the open mirror 1038lab/sam3)
        ckpt = Path("models/sam3/sam3.pt")
        if not ckpt.exists():
            from huggingface_hub import hf_hub_download
            ckpt.parent.mkdir(parents=True, exist_ok=True)
            p = hf_hub_download(repo_id="1038lab/sam3", filename="sam3.pt", local_dir="models/sam3")
            print("downloaded SAM 3 checkpoint:", p)
        else:
            print("SAM 3 checkpoint already present:", ckpt)
        # 2) CLIP BPE vocab expected by sam3's text tokenizer (not shipped by the pip package)
        sp = Path(site.getsitepackages()[0])
        assets = sp / "assets" / "bpe_simple_vocab_16e6.txt.gz"
        if not assets.exists():
            assets.parent.mkdir(parents=True, exist_ok=True)
            import urllib.request
            url = "https://raw.githubusercontent.com/openai/CLIP/main/clip/bpe_simple_vocab_16e6.txt.gz"
            urllib.request.urlretrieve(url, assets)
            print("downloaded BPE vocab:", assets)
        else:
            print("BPE vocab already present:", assets)
        PY

  check:
    desc: Print Python, torch, and CUDA availability
    cmds:
      - |-
        {{.PY}} - <<'PY'
        import torch, platform
        print("python", platform.python_version())
        print("torch", torch.__version__, "cuda?", torch.cuda.is_available())
        if torch.cuda.is_available():
            print("device", torch.cuda.get_device_name(0))
        PY