version: "3"

tasks:
  download:
    desc: "Download the configured real dataset (default: SVHN) into data/raw"
    cmds:
      - .venv/bin/python -m numeri dataset-download

  parse:
    desc: Convert the raw real dataset to YOLO format under data/real_yolo
    dir: .
    sources:
      - data/raw
    generates:
      - data/real_yolo/data.yaml
    cmds:
      - .venv/bin/python -m numeri dataset-parse