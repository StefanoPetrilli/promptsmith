version: "3"

# The synthetic-wrench pipeline (see PLAN.md).
# Each step has a `*-test` task that runs on a handful of images for verification.
# The test variants write to the SAME folders as the normal tasks (no `_test` dirs).
#
#   prompts               stage 1 — weighted-axis prompts -> data/prompts/<mode>/
#   images                stage 2 — FLUX.2-klein-4B render every leaf -> data/synthetic/images/
#   images-test           stage 2 — render first 3 prompts per leaf
#   label                 stage 3 — SAM 3 text-grounded wrench boxes -> data/synthetic/labels/
#   label-test            stage 3 — label first 3 images per leaf
#   visualize             stage 4 — overlay SAM 3 masks + boxes -> data/synthetic/visuals/
#   visualize-test        stage 4 — overlay first 3 images per leaf
#   handpick              stage 5 — human approve/discard of segmentations -> data/synthetic/approved/(+discarded/)
#   handpick-test         stage 5 — review first 3 segmentations per leaf
#   postprocess           stage 6 — Albumentations degradation (approved only) -> data/synthetic/images_pp/
#   postprocess-test      stage 6 — degrade first 3 approved images per leaf
#   visualize-pp          stage 6b — overlay YOLO boxes on degraded images -> data/synthetic/visuals_pp/
#   visualize-pp-test     stage 6b — overlay first 3 degraded images per leaf
#   train                 stage 7 — assemble dataset + fine-tune YOLO (approved only) -> data/dataset/
#   train-test            stage 7 — 1-epoch smoke -> data/dataset/
#
# data/ layout:
#   data/prompts/            stage 1 seed prompts
#   data/synthetic/          intermediates (images, labels, visuals, approved, discarded, images_pp, visuals_pp)
#   verification_dataset/   real hold-out images (positive/ hard_negatives/ negatives/) +
#                           assembled/ flat versioned YOLO set (images/ labels/ manifest.json VERSION)
#   data/dataset/            stage 7 assembled YOLO dataset + runs
#   data/inference/          model inference outputs (train, val, verification)

vars:
  PY: .venv/bin/python
  MODEL: black-forest-labs/FLUX.2-klein-4B
  SAM3_CKPT: models/sam3/sam3.pt
  SIZE: "768"
  STEPS: "8"
  # --- prompt counts per mode (tune the dataset size from here) --------------
  # clean_positive
  N_CLEAN: "170"
  # hard_positive
  N_HARD: "50"
  # asset
  N_ASSET: "10"
  # negatives
  N_HARD_NEG: "50"
  N_PURE_NEG: "20"

tasks:
  prompts:
    desc: "Stage 1: weighted-axis wrench prompts -> data/prompts/<mode>/"
    cmds:
      # clean_positive — isolated, fully-framed wrenches on simple backgrounds
      - "{{.PY}} pipeline/generate_prompts.py --mode clean_positive --n {{.N_CLEAN}} --out data/prompts"
      # hard_positive — small / distant / occluded / frame-edge / cluttered wrenches
      - "{{.PY}} pipeline/generate_prompts.py --mode hard_positive --n {{.N_HARD}} --out data/prompts"
      # asset — isolated product shots on plain backgrounds
      - "{{.PY}} pipeline/generate_prompts.py --mode asset --n {{.N_ASSET}} --out data/prompts"
      # negatives — no wrench
      - "{{.PY}} pipeline/generate_prompts.py --mode hard_negative --n {{.N_HARD_NEG}} --out data/prompts"
      - "{{.PY}} pipeline/generate_prompts.py --mode pure_negative --n {{.N_PURE_NEG}} --out data/prompts"

  images:
    desc: "Stage 2: render every leaf prompt folder with FLUX.2-klein-4B -> data/synthetic/images/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/prompts --marker prompts.txt
        --out-root data/synthetic/images --input-arg prompts
        --script pipeline/generate_images.py
        --prefix {rel}_
        -- --model {{.MODEL}} --size {{.SIZE}} --steps {{.STEPS}}

  images-test:
    desc: "Stage 2 (test): render first 3 prompts per leaf -> data/synthetic/images/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/prompts --marker prompts.txt
        --out-root data/synthetic/images --input-arg prompts
        --script pipeline/generate_images.py
        --prefix {rel}_
        -- --model {{.MODEL}} --size {{.SIZE}} --steps {{.STEPS}} --limit 3

  label:
    desc: "Stage 3: label each leaf with SAM 3 (text 'wrench', conf>=0.55) -> data/synthetic/labels/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/synthetic/images --marker manifest.jsonl
        --out-root data/synthetic/labels --input-arg images
        --script pipeline/label_images.py
        -- --model-path {{.SAM3_CKPT}} --confidence 0.55

  label-test:
    desc: "Stage 3 (test): label first 3 images per leaf -> data/synthetic/labels/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/synthetic/images --marker manifest.jsonl
        --out-root data/synthetic/labels --input-arg images
        --script pipeline/label_images.py
        -- --model-path {{.SAM3_CKPT}} --confidence 0.55 --limit 3

  visualize:
    desc: "Stage 4: overlay SAM 3 segmentation + boxes on all images -> data/synthetic/visuals/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/synthetic/labels --marker labels.jsonl
        --out-root data/synthetic/visuals --input-arg labels
        --script pipeline/visualize_labels.py
        --

  visualize-test:
    desc: "Stage 4 (test): overlay first 3 images per leaf -> data/synthetic/visuals/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/synthetic/labels --marker labels.jsonl
        --out-root data/synthetic/visuals --input-arg labels
        --script pipeline/visualize_labels.py
        -- --limit 3

  handpick:
    desc: "Stage 5: human approve/discard of segmentations -> data/synthetic/approved/ (+discarded/)"
    cmds:
      - >-
        {{.PY}} pipeline/handpick.py
        --visuals-root data/synthetic/visuals
        --images-root data/synthetic/images
        --labels-root data/synthetic/labels
        --out-root data/synthetic/approved
        --discard-root data/synthetic/discarded

  handpick-test:
    desc: "Stage 5 (test): review first 3 segmentations per leaf"
    cmds:
      - >-
        {{.PY}} pipeline/handpick.py
        --visuals-root data/synthetic/visuals
        --images-root data/synthetic/images
        --labels-root data/synthetic/labels
        --out-root data/synthetic/approved
        --discard-root data/synthetic/discarded
        --limit 3

  postprocess:
    desc: "Stage 6: deterministic Albumentations degradation (approved only) -> data/synthetic/images_pp/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/synthetic/approved/images --marker manifest.jsonl
        --out-root data/synthetic/images_pp --input-arg images
        --script pipeline/postprocess_images.py
        --

  postprocess-test:
    desc: "Stage 6 (test): degrade first 3 approved images per leaf -> data/synthetic/images_pp/"
    cmds:
      - >-
        {{.PY}} pipeline/run_leaves.py
        --root data/synthetic/approved/images --marker manifest.jsonl
        --out-root data/synthetic/images_pp --input-arg images
        --script pipeline/postprocess_images.py
        -- --limit 3

  visualize-pp:
    desc: "Stage 6b: overlay YOLO boxes on post-processed images -> data/synthetic/visuals_pp/"
    cmds:
      - >-
        {{.PY}} pipeline/visualize_labels.py --format yolo
        --images data/synthetic/images_pp
        --labels data/synthetic/approved/labels
        --out data/synthetic/visuals_pp

  visualize-pp-test:
    desc: "Stage 6b (test): overlay first 3 post-processed images per leaf -> data/synthetic/visuals_pp/"
    cmds:
      - >-
        {{.PY}} pipeline/visualize_labels.py --format yolo
        --images data/synthetic/images_pp
        --labels data/synthetic/approved/labels
        --out data/synthetic/visuals_pp --limit 3

  assemble-verification:
    desc: "Assemble + version the real verification dataset -> verification_dataset/assembled/ (images/ labels/ manifest.json VERSION)"
    cmds:
      - "{{.PY}} pipeline/assemble_verification.py --root verification_dataset --out verification_dataset/assembled"

  visualize-verification:
    desc: "Overlay YOLO GT boxes on the assembled verification set -> verification_dataset/assembled/visuals/"
    cmds:
      - "{{.PY}} pipeline/visualize_labels.py --format yolo \
        --images verification_dataset/assembled/images \
        --labels verification_dataset/assembled/labels \
        --out verification_dataset/assembled/visuals"

  train:
    desc: "Stage 7: assemble single-class YOLO dataset (from approved images_pp/) + fine-tune"
    cmds:
      - "{{.PY}} pipeline/train_yolo.py --images data/synthetic/approved/images --labels data/synthetic/approved/labels \
        --out data/dataset --base models/yolo26n.pt --epochs 50"

  train-real-val:
    desc: "Stage 7: train on approved synthetic, validate on real verification dataset (assembled)"
    cmds:
      - "{{.PY}} pipeline/train_yolo.py --images data/synthetic/approved/images --labels data/synthetic/approved/labels \
        --val-images verification_dataset/assembled/images --val-labels verification_dataset/assembled/labels \
        --out data/dataset --base models/yolo26n.pt --epochs 500 --patience 20 \
        --imgsz 640 --scale 0.5 --translate 0.2"

  train-test:
    desc: "Stage 7 (test): 1-epoch smoke -> data/dataset/"
    cmds:
      - "{{.PY}} pipeline/train_yolo.py --images data/synthetic/approved/images --labels data/synthetic/approved/labels \
        --out data/dataset --base models/yolo26n.pt --epochs 1 --imgsz 320 --batch 1 \
        --allow-dummy-labels"

  inference-train:
    desc: "Run trained model on the training set and save visualizations"
    cmds:
      - "{{.PY}} pipeline/inference.py --model data/dataset/runs/train/weights/best.pt \
        --source data/dataset/images/train \
        --gt-labels data/dataset/labels/train \
        --out data/inference/train"

  inference-val:
    desc: "Run trained model on the validation set and save visualizations"
    cmds:
      - "{{.PY}} pipeline/inference.py --model data/dataset/runs/train/weights/best.pt \
        --source data/dataset/images/val \
        --gt-labels data/dataset/labels/val \
        --out data/inference/val"

  inference-verification:
    desc: "Run trained model on the verification dataset, compare to GT boxes"
    cmds:
      - "{{.PY}} pipeline/inference.py --model data/dataset/runs/train/weights/best.pt \
        --source verification_dataset/assembled/images \
        --gt-labels verification_dataset/assembled/labels \
        --out data/inference/verification"