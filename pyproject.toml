[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numeri"
version = "0.0.1"
description = "Local synthetic dataset generation + auto-labeling pipeline for YOLO fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "stefanopetrilli" }]
license = { text = "MIT" }
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pillow>=10.0",
  "tqdm>=4.65",
  "ultralytics>=8.1",
  "diffusers>=0.27",
  "transformers>=4.40",
  "accelerate>=0.27",
  "bitsandbytes>=0.43",
  "torchao>=0.9",
  "gguf>=0.10",
  "scipy>=1.10",
  "sam3>=0.1.1",
  "iopath>=0.1.10",
  "huggingface_hub>=0.20",
  "albumentations>=2.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.3"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"