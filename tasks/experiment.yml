version: "3"

tasks:
  sana:
    desc: Run standalone SANA quality probe (600M/512px, offload for 6 GB VRAM)
    cmds:
      - .venv/bin/python experiments/try_sana.py
        --model Efficient-Large-Model/Sana_600M_512px_diffusers
        --prompts experiments/svhn_prompts.txt
        --out experiments/out/sana
        --size 512 --steps 20 --guidance 4.5 --dtype fp16 --offload

  sana-1024:
    desc: Try the 600M @ 1024px SANA variant (needs --offload on 6 GB VRAM)
    cmds:
      - .venv/bin/python experiments/try_sana.py
        --model Efficient-Large-Model/Sana_600M_1024px_diffusers
        --out experiments/out/sana_1024
        --size 1024 --steps 20 --offload

  flux2:
    desc: FLUX.2-klein-4B NF4 probe (Qwen3 embeds on CPU, NF4 transformer on 6 GB GPU)
    cmds:
      - .venv/bin/python experiments/try_flux2.py
        --model black-forest-labs/FLUX.2-klein-4B
        --prompts experiments/svhn_prompts.txt
        --out experiments/out/flux2
        --size 768 --steps 8 --dtype fp16